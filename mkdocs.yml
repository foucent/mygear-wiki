site_name: MyGear.Top
site_url: https://mygear.top/
site_description: Table tennis blades, rubbers, pre-owned gear, buying guides, and brand photo galleries — USD prices with WhatsApp checkout.
copyright: "© 2026 Mygear.top. All rights reserved. Independently published since 2025."
# Validation / log-level tuning. The /gear/ product & brand pages and the 18
# /guide/ articles are intentionally kept out of the nav (they are linked from
# the price tables, the homepage feed, and docs/guide/index.md, and are listed
# in the sitemap), so only log their omission at INFO. Broken doc links and
# anchors keep the default WARNING so real problems surface.
validation:
  nav:
    omitted_files: info
hooks:
  - hooks/product_schema.py
theme:
  name: material
  custom_dir: overrides
  language: custom
  # No webfonts: the theme runs on the system stacks (see --ab-sans / --ab-serif
  # in stylesheets/tokens.css), so nothing third-party is on the critical path.
  font: false
  # `custom` is load-bearing, not cosmetic. A real palette name makes Material
  # write its own --md-* custom properties onto <body>, and a custom property
  # declared on <body> beats anything inherited from :root no matter what the
  # file order or specificity is — so tokens.css could not override it. With
  # `custom` Material emits no palette rule at all and :root is the only source.
  palette:
    scheme: default
    primary: custom
    accent: custom
  icon:
    logo: material/table-tennis
  features:
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tables.scroll
    - navigation.sections

plugins:
  - search
  - redirects:
      redirect_maps:
        price-list.md: blades.md
        # The page moved from /updates-reviews/ to /updates/; the stub the
        # redirects plugin writes keeps the old URL alive for anything already
        # pointing at it (search results, inbound links, the sitemap's history).
        updates-reviews.md: updates.md
