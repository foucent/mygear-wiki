markdown_extensions:
  - toc
  - tables
  - fenced_code
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons

# Order is load-bearing. tokens.css defines the variables every later file
# reads; header.css replaces Material's masthead; uncrate.css goes last so its
# plain rules can win ties against extra.css's 200+ !important declarations
# without having to out-rank them.
extra_css:
  - stylesheets/tokens.css
  - stylesheets/extra.css
  - stylesheets/photo-wall.css
  - stylesheets/header.css
  - stylesheets/uncrate.css

extra_javascript:
  - javascripts/img-thumbs.js
  - javascripts/whatsapp-float.js
  - javascripts/preowned-grid.js
  - javascripts/gallery-lightbox.js
  - javascripts/photo-wall.js
  - javascripts/hero-slides.js
  - javascripts/unit-copy.js
  - javascripts/bio-toggle.js
  - javascripts/price-cart.js
  - javascripts/price-pager.js
  - javascripts/guide-grid.js

# Local `mkdocs serve` includes these; production `mkdocs build` / GitHub Pages omit them.
draft_docs: |
  shop/pricing-and-sourcing.backup.md

# Hot-reload overrides/ (template notes, header tweaks). docs/ is watched by default.
watch:
  - overrides

extra:
  generator: false
  # The black band's family strip. AceBase lists its sibling sites here and
  # appends its own @handle; this site has no siblings to list, so the strip
  # carries the brand alone. header.html adds the other two items — the cart,
  # between this one and the @handle, and the "@ MyGear.Top" that opens the
  # YouTube channel — because both need the handler/markup the loop can't give
  # them.
  family:
    - label: MyGear.Top
      link: /
  analytics:
    provider: google
    property: G-1VPCP3FZN6
  # No `social:` block. It was the YouTube icon in the footer, and the same
  # channel is now the "@ MyGear.Top" item in the masthead strip — one link to
  # the channel, at the top of every page rather than the bottom.

# 导航配置在这里
nav:
  - Home: index.md
  - Blades: blades.md
  - Rubbers: rubbers.md
  - Add-ons: add-ons.md
  - Pre-owned: pre-owned.md
  # Short labels: the nav row is eight items wide at 28px, so anything longer
  # than one word costs a line. The page headings and the frontmatter
  # descriptions are unchanged, so the pages themselves still read in full.
  #
  # Title case, and kept there — ALL CAPS re-measured at 77px over two lines
  # against these 43px over one, which would undo the shortening above. FAQ
  # stays upper because it is an initialism, not a word. Guides is plural to
  # match the three catalogue entries; the rest are singular because they name
  # a process (Order), one running log (Updates), or one Q&A page (FAQ).
  - Order: order.md
  - FAQ: FAQ.md
  - Updates: updates.md
  # The 18 guide articles are deliberately *not* listed here — they live on
  # docs/guide/index.md, which is both this entry's target and the full index.
  # Listing them again as children would put the whole group back in the
  # sidebar, which is what moving the entry up here was meant to remove.
  - Guides: guide/index.md
